name: snapcraft-confdb-builder
title: Snapcraft ConfDB Builder
version: '1.0.0'
summary: Desktop workbench for Snapcraft ConfDB schema assertions
description: |
  A graphical tool for authoring and publishing Snapcraft ConfDB schema
  assertions.

confinement: classic
grade: stable
base: core24

platforms:
  amd64:
  arm64:

apps:
  snapcraft-confdb-builder:
    command: bin/snapcraft_confdb_builder

parts:
  app:
    plugin: nil
    source: .
    build-packages:
      - clang
      - cmake
      - libgtk-3-dev
      - ninja-build
    override-build: |
      flutter pub get
      flutter build linux --release
      mkdir -p $CRAFT_PART_INSTALL/bin
      cp -r build/linux/*/release/bundle/* $CRAFT_PART_INSTALL/bin/