name: snapcraft-confdb-builder
title: Snapcraft ConfDB Builder
version: '1.0.2'
summary: Desktop workbench for Snapcraft ConfDB schema assertions
description: |
  A graphical tool for authoring and publishing Snapcraft ConfDB schema
  assertions.

confinement: classic
grade: stable
base: core24

platforms:
  amd64:
  arm64:

apps:
  snapcraft-confdb-builder:
    command: snapcraft_confdb_builder

parts:
  app:
    plugin: flutter
    source: .
    flutter-target: lib/main.dart
    build-packages:
      - clang
      - cmake
      - libgtk-3-dev
      - ninja-build
    stage-packages:
      - libgtk-3-0